    why: "Data-protection law ties what may be captured to purpose and proportionality (GDPR Articles 5 and 35); metadata is cheap and full text is the costly, regulated tier."
  - key: jurisdiction-eu
    family: record
    question: "Where do the people whose prompts would be captured work? (Select every region that applies; eu selects this key.)"
    method: [I]
    weight: INVENTORY
