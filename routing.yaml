# routing.yaml: the signal-to-document routing table, as data.
#
# AUDIT-CONTEXT.md's routing section is rendered from this file by
# scripts/render-audit-context.py, and CI fails when the two disagree.
# scripts/route.py reads an Answers Block (and any reducer output) with this
# file and the sequence-order block in analysis/decision-sequence.md, and prints
# the branch, the ranked actions, the doc list and the Question
# Packets, so anyone can check an agent's routing against the table; CI holds it
# to the three golden fixtures in fixtures/.
#
# pre-release:start (the release script's stamp step rewrites the text between these markers)
# State: pre-release. Every signal key in the design is present with its
# question, collection method, weight, priority and target docs. The target
# docs are being written one at a time, and the routing-coverage check requires
# each shipped doc's applies-to-signals to match the rows that route to it.
# The factor scores and the surface-to-signal "enables" lists are the author's
# initial judgement (Tier D) and are expected to move after the dry runs.
# pre-release:end
#
# Machine-readable fields beside the prose, so scripts/route.py and the
# rendered AUDIT-CONTEXT section read the same data and cannot drift:
#   escalate-if     every name listed must be observed (a signal key selected,
#                   or an observation above zero) before the escalation applies;
#                   the band then becomes High
#   escalate-weight the weight the row takes when the escalation applies
#   requires        signal keys that must all be selected before the row is
#                   eligible at all
#   owner           overrides the family's owning role for Question Packets
# scripts/check-routing-coverage.py fails when an escalation has no
# escalate-if, when a name in escalate-if or requires is neither a key nor a
# declared observation, and when a row's factors do not fold into its band.

version: 0
release: unreleased

always-fetch:
  - analysis/evidence-tiers.md
  - analysis/surface-ownability.md
  - analysis/revalidation-and-pins.md
  - analysis/decision-sequence.md

weights:
  PROBLEM: "Produces an action in the output."
  REVIEW: "Listed under Prioritized actions after the PROBLEM rows, with the matched answer quoted; never takes a top-action slot, even at High, and becomes a PROBLEM only where its escalation sets escalate-weight."
  INVENTORY: "A count or a fact that enables other rows; never adds a fetch on its own."

methods:
  I: "Interview: asked of the practitioner, recorded with observation confidence (read, owner-stated, believed)."
  E: "Export: read from a local reducer's output, or from a raw export the practitioner accepts sending."
  D: "Derived: computed from other keys by the stated predicate; never asked."

observation-confidence:
  read: "From a reducer or an export."
  owner-stated: "The practitioner has it from the team that owns the system."
  believed: "The person answering thinks so. Caps priority at Medium and adds a confirm-with role."

# Priority is how bad the condition is if it is true. It is separate from
# confidence, which is the backing doc's evidence-tier and convergence and is
# printed beside every action. Each PROBLEM or REVIEW row scores four factors
# from 0 to 2 and the sum folds into a band. An escalation names the condition
# under which the band rises; it is applied only when that condition was
# observed, never assumed.
priority-rubric:
  factors:
    reach:
      0: "internal-only"
      1: "reachable by a vendor, partner or other tenant"
      2: "internet-reachable"
    stakes:
      0: "no sensitive data or credentials"
      1: "business data"
      2: "credentials, secrets or regulated personal data"
    reversibility:
      0: "reversible by changing a setting"
      1: "reversible with effort"
      2: "not reversible once it happens (data disclosed, trained on or acted on)"
    blast:
      0: "one user or one system"
      1: "one team or one surface"
      2: "organization-wide"
  bands:
    High: "sum 6 to 8"
    Medium: "sum 3 to 5"
    Low: "sum 0 to 2"
  caps:
    - "A believed observation caps the band at Medium."
    - "A Tier D perspective orders actions within a band and never raises one."
  ordering: "Within a band, order actions by three keys in turn, which is exactly what the reference mapper does and is the whole ordering rule: the sequence group from the `sequence-order` block in `analysis/decision-sequence.md` (a row named under `row-overrides` takes that group, any other row takes its family's group, and groups run in the order the block lists them), then factor sum, highest first, then the row's `#` (its position in `routing.yaml`, shown in the routing tables), lowest first. Tier does not break ties, because it is confidence and never priority, and effort does not either: print each action's effort (S, M or L) beside it as information for whoever schedules the work, and never sort by it, whatever the organization's size. Order REVIEW rows the same way, in their own list after the PROBLEM rows."

interview-branches:
  first-questions: [org-size-small-mid, profile-rent-heavy]
  small-org:
    selected-when: "org-size-small-mid and profile-rent-heavy"
    families: [S1, S2, S3, S4, S8]
    target: "about twelve questions and fifteen minutes; remaining families offered as one 'anything else?' question; negative guards batched into one line"
  full:
    selected-when: "any other combination"
    target: "about five questions per surface family present"
  top-actions: {small-org: 5, full: 7}

# The role a Question Packet is addressed to, per routing family. A row's
# `owner` field overrides it. Author's judgement (Tier D).
family-owners:
  profile: "security lead"
  surface: "IT administrator"
  record: "logging or security operations owner"
  identity: "identity team"
  incident-response: "incident response lead"
  coding-agent: "engineering platform team"
  mcp: "engineering platform team"
  shadow-ai: "IT administrator"
  saas: "SaaS owners and procurement"
  artifacts: "ML platform team"
  governance: "risk or compliance owner"
  frameworks: "risk or compliance owner"
  soc: "SOC manager"
  assistant-oversharing: "collaboration-suite administrator"
  rag: "team that runs the RAG store"
  agent-builders: "low-code platform administrator"
  ai-you-ship: "product engineering lead"

# Observations: counts and facts that are not routing keys themselves but that
# reducers print or the interview records, and that escalations read. A
# reducer may print only names declared here or signal keys; its tests check
# that. Every value is an integer of zero or more, or true or false.
observations:
  # interview facts that escalations depend on
  surface-internet-reachable: {from: interview, meaning: "The surface in question is reachable from the internet."}
  regulated-data-in-scope: {from: interview, meaning: "The surface handles regulated personal data."}
  runtime-internet-reachable: {from: interview, meaning: "A self-hosted inference runtime is reachable from the internet."}
  # consent-grant reducers (Entra, Google Workspace)
  ai-apps-with-grants: {from: "entra-consent-grants, google-workspace-oauth", meaning: "Distinct AI-category apps holding at least one OAuth grant."}
  ai-grants-mail-or-file-scope: {from: "entra-consent-grants, google-workspace-oauth", meaning: "AI-category grants whose scopes reach mail or files."}
  ai-grants-user-consented: {from: "entra-consent-grants, google-workspace-oauth", meaning: "AI-category grants a user consented to."}
  ai-grants-admin-consented: {from: entra-consent-grants, meaning: "AI-category grants an administrator consented to for the whole tenant."}
  grant-rows-unparsed: {from: "entra-consent-grants, google-workspace-oauth", meaning: "Rows the reducer could not read; non-zero means the counts are a floor."}
  # IdP app-list reducer (Okta)
  ai-apps-in-idp: {from: okta-apps, meaning: "Distinct AI-category apps in the IdP app list."}
  ai-apps-federated: {from: okta-apps, meaning: "AI-category apps signing in through SAML, OIDC or WS-Federation."}
  ai-apps-not-federated: {from: okta-apps, meaning: "AI-category apps on a bookmark, password vaulting or other non-federated sign-on mode."}
  ai-apps-inactive: {from: okta-apps, meaning: "AI-category apps the list marks inactive."}
  # browser extension reducer (Chrome Enterprise, Intune)
  ai-extensions-total: {from: browser-extensions, meaning: "Distinct AI-category extensions installed anywhere in the report."}
  ai-extensions-force-installed: {from: browser-extensions, meaning: "AI-category extensions the administrator force-installs."}
  ai-extensions-admin-allowed: {from: browser-extensions, meaning: "AI-category extensions on an administrator allowlist and installed by users."}
  ai-extensions-user-installed: {from: browser-extensions, meaning: "AI-category extensions users installed with no administrator action."}
  ai-extensions-mode-unknown: {from: browser-extensions, meaning: "AI-category extensions whose install mode the report does not state."}
  # expense reducer
  ai-vendors-in-spend: {from: expense-ai-vendors, meaning: "Distinct AI vendors appearing in card or expense lines."}
  ai-spend-lines: {from: expense-ai-vendors, meaning: "Card or expense lines matched to an AI vendor."}
  ai-spend-lines-personal-card: {from: expense-ai-vendors, meaning: "Matched lines the export marks as reimbursed personal spend."}
  # MCP config reducer
  mcp-server-count: {from: mcp-config, meaning: "MCP servers declared across the config files given."}
  mcp-local-count: {from: mcp-config, meaning: "Servers started as a local process."}
  mcp-remote-count: {from: mcp-config, meaning: "Servers reached by URL."}
  mcp-unpinned-count: {from: mcp-config, meaning: "Local servers started from a package runner with no exact version."}
  mcp-pinned-count: {from: mcp-config, meaning: "Local servers started from a package runner with an exact version."}
  mcp-inline-secret-count: {from: mcp-config, meaning: "Secret-looking values written inline in env, headers, args or URLs (values never printed)."}
  # coding-agent settings reducer
  settings-files-read: {from: coding-agent-settings, meaning: "Settings or hooks files the reducer parsed."}
  managed-tier-seen: {from: coding-agent-settings, meaning: "A managed (administrator) tier file was among the inputs."}
  hooks-configured: {from: coding-agent-settings, meaning: "Hook commands configured across the inputs."}
  hooks-fail-closed: {from: coding-agent-settings, meaning: "Hook commands configured to block when the hook fails or times out."}
  hooks-outside-managed: {from: coding-agent-settings, meaning: "Hook commands configured in user, project or local scope."}
  deny-rules: {from: coding-agent-settings, meaning: "Permission deny rules across the inputs."}
  disable-all-hooks-set: {from: coding-agent-settings, meaning: "Files that set the switch that turns every hook off."}
  managed-locks-set: {from: coding-agent-settings, meaning: "Managed lock settings present (managed-only hooks, managed-only permission rules, bypass mode disabled)."}


signals:

  # --- profile ---
  - key: org-size-small-mid
    family: profile
    question: "Roughly how many people work at the organization, and does a sector regulator (financial, health, energy, public sector) supervise how it handles data? (Answer with a band: under about 1,000 people and no sector regulator selects this key.)"
    method: [I]
    weight: INVENTORY
    docs: [analysis/rent-or-own-sized-to-the-org.md, analysis/build-buy-and-the-high-priest.md]
    why: "Selects the small-org interview branch. Sizing comes first because the rent-or-own judgement and the effort ranking both depend on staff and regulatory load."
  - key: org-size-large-regulated
    family: profile
    question: "Same question as org-size-small-mid; about 1,000 people or more, or any sector regulator, selects this key."
    method: [I]
    weight: INVENTORY
    docs: [analysis/rent-or-own-sized-to-the-org.md, analysis/build-buy-and-the-high-priest.md]
    why: "Selects the full interview branch."
  - key: profile-rent-heavy
    family: profile
    question: "Does the organization run any of these itself: self-hosted model serving, fine-tuned models, or a RAG or vector store it operates? (No to all three selects this key.)"
    method: [I, D]
    predicate: "not (surface-S9 or surface-S11 or surface-S12)"
    weight: INVENTORY
    docs: [analysis/rent-or-own-sized-to-the-org.md]
    why: "None of the three surfaces where the organization owns every CoSAI component it instantiates is present, so effort goes to identity, the enforcement point, configuration and exported logs."
  - key: profile-own-heavy
    family: profile
    question: "Same question as profile-rent-heavy; yes to any of the three selects this key, confirmed later by the surface keys."
    method: [I, D]
    predicate: "surface-S9 or surface-S11 or surface-S12"
    weight: REVIEW
    priority:
      band: Low
      factors: {reach: 0, stakes: 0, reversibility: 1, blast: 1}
    docs: [analysis/rent-or-own-sized-to-the-org.md, analysis/models-you-hold.md]
    why: "At least one fully owned surface is present, which brings its patching, logging, identity and detection with it."

  # --- surface ---
  - key: surface-S1
    family: surface
    question: "Does the organization run AI features inside SaaS applications you already pay for? (yes, no, or not sure)"
    method: [I, E]
    weight: INVENTORY
    enables: [saas-ai-toggles-unreviewed, vendor-training-optout-unknown, ai-subprocessor-review-absent, oauth-grants-unreviewed, grounding-permissions-unreviewed]
    docs: [analysis/surface-ownability.md]
    why: "Enables the S1 family rows. The CoSAI component map decides which parts of this surface are the organization's to secure."
  - key: surface-S2
    family: surface
    question: "Does the organization run enterprise assistants (the office-suite assistant or a licensed chat assistant)? (yes, no, or not sure)"
    method: [I, E]
    weight: INVENTORY
    enables: [audit-log-off-<platform>, content-channel-off, content-channel-on, plan-tier-below-audit, vendor-training-optout-unknown, grounding-permissions-unreviewed, sensitivity-labels-absent, restricted-search-unset]
    docs: [analysis/surface-ownability.md]
    why: "Enables the S2 family rows. The CoSAI component map decides which parts of this surface are the organization's to secure."
  - key: surface-S3
    family: surface
    question: "Does the organization run AI in the browser (built-in assistants and extensions)? (yes, no, or not sure)"
    method: [I, E]
    weight: INVENTORY
    enables: [shadow-ai-method-none, shadow-ai-method-network-only, tenant-restriction-absent]
    docs: [analysis/surface-ownability.md]
    why: "Enables the S3 family rows. The CoSAI component map decides which parts of this surface are the organization's to secure."
  - key: surface-S4
    family: surface
    question: "Does the organization run IDE and coding agents? (yes, no, or not sure)"
    method: [I, E]
    weight: INVENTORY
    enables: [coding-agent-managed-tier-absent, hook-fail-open, hooks-user-disableable, mcp-allowlist-absent, agent-static-secrets]
    docs: [analysis/surface-ownability.md]
    why: "Enables the S4 family rows. The CoSAI component map decides which parts of this surface are the organization's to secure."
  - key: surface-S5
    family: surface
    question: "Does the organization run MCP servers and agent tools? (yes, no, or not sure)"
    method: [I, E]
    weight: INVENTORY
    enables: [mcp-allowlist-absent, mcp-unpinned, mcp-remote, mcp-manifest-snapshot-absent, agent-static-secrets, nhi-inventory-absent]
    docs: [analysis/surface-ownability.md]
    why: "Enables the S5 family rows. The CoSAI component map decides which parts of this surface are the organization's to secure."
  - key: surface-S6
    family: surface
    question: "Does the organization run low-code agent and workflow builders? (yes, no, or not sure)"
    method: [I, E]
    weight: INVENTORY
    enables: [agent-publish-approval-absent, maker-credential-agents, agent-external-sharing-unreviewed, connector-sprawl-unreviewed, nhi-inventory-absent]
    docs: [analysis/surface-ownability.md]
    why: "Enables the S6 family rows. The CoSAI component map decides which parts of this surface are the organization's to secure."
  - key: surface-S7
    family: surface
    question: "Does the organization run managed AI build platforms in a cloud account? (yes, no, or not sure)"
    method: [I, E]
    weight: INVENTORY
    enables: [agent-publish-approval-absent, connector-sprawl-unreviewed, audit-log-off-<platform>, cloud-trail-default-only]
    docs: [analysis/surface-ownability.md]
    why: "Enables the S7 family rows. The CoSAI component map decides which parts of this surface are the organization's to secure."
  - key: surface-S8
    family: surface
    question: "Does the organization run direct model API use and AI gateways? (yes, no, or not sure)"
    method: [I, E]
    weight: INVENTORY
    enables: [ai-gateway-absent, gateway-token-store-unreviewed, cloud-trail-default-only, agent-static-secrets, output-handling-unreviewed, pre-release-eval-absent, abuse-monitoring-absent]
    docs: [analysis/surface-ownability.md]
    why: "Enables the S8 family rows. The CoSAI component map decides which parts of this surface are the organization's to secure."
  - key: surface-S9
    family: surface
    question: "Does the organization run self-hosted model serving? (yes, no, or not sure)"
    method: [I, E]
    weight: INVENTORY
    enables: [inference-runtime-default-bind, model-store-unscanned, pickle-formats-present]
    docs: [analysis/surface-ownability.md]
    why: "Enables the S9 family rows. The CoSAI component map decides which parts of this surface are the organization's to secure."
  - key: surface-S10
    family: surface
    question: "Does the organization run local on-device open-weight models? (yes, no, or not sure)"
    method: [I, E]
    weight: INVENTORY
    enables: [inference-runtime-default-bind, model-store-unscanned, pickle-formats-present]
    docs: [analysis/surface-ownability.md]
    why: "Enables the S10 family rows. The CoSAI component map decides which parts of this surface are the organization's to secure."
  - key: surface-S11
    family: surface
    question: "Does the organization run fine-tuned models and their pipelines? (yes, no, or not sure)"
    method: [I, E]
    weight: INVENTORY
    enables: [fine-tuned-models, training-record-absent, model-store-unscanned]
    docs: [analysis/surface-ownability.md]
    why: "Enables the S11 family rows. The CoSAI component map decides which parts of this surface are the organization's to secure."
  - key: surface-S12
    family: surface
    question: "Does the organization run RAG pipelines and vector stores? (yes, no, or not sure)"
    method: [I, E]
    weight: INVENTORY
    enables: [rag-acl-propagation-unknown, ingestion-integrity-unreviewed, embeddings-outside-governance]
    docs: [analysis/surface-ownability.md]
    why: "Enables the S12 family rows. The CoSAI component map decides which parts of this surface are the organization's to secure."
  - key: surface-S13
    family: surface
    question: "Does the organization run AI inside security tools (an AI analyst or agent in the SOC)? (yes, no, or not sure)"
    method: [I, E]
    weight: INVENTORY
    enables: [ai-analyst-ungraded, containment-pre-authorized-broad, telemetry-into-llm]
    docs: [analysis/surface-ownability.md]
    why: "Enables the S13 family rows. The CoSAI component map decides which parts of this surface are the organization's to secure."

  # --- profile ---
  - key: own-heavy-small-org
    family: profile
    question: "Derived: no question asked."
    method: [D]
    predicate: "profile-own-heavy and org-size-small-mid"
    weight: REVIEW
    priority:
      band: Medium
      factors: {reach: 0, stakes: 1, reversibility: 1, blast: 1}
    docs: [analysis/rent-or-own-sized-to-the-org.md]
    why: "A small organization owning a surface takes on the full operating load of it; the review names that cost beside any recommendation to keep owning it."
  - key: surface-unknown
    family: profile
    question: "Can you say which of the thirteen surfaces the organization runs? (No, or not for most of them, selects this key.)"
    method: [I]
    weight: PROBLEM
    priority:
      band: High
      factors: {reach: 1, stakes: 2, reversibility: 1, blast: 2}
    docs: [analysis/inventory-and-shadow-ai.md]
    why: "Every later control assumes an inventory; without one the review cannot say what is in scope, so discovery is the first action."

  # --- record ---
  - key: audit-log-off-<platform>
    family: record
    pattern: "audit-log-off-<platform>"
    values: [office-suite-assistant, managed-model-platform, coding-agent, mcp-host, browser, identity-platform, data-governance-platform]
    question: "For each platform in use (from the closed list), is the per-interaction audit record turned on, and do you know where it lands?"
    method: [I, E]
    weight: PROBLEM
    priority:
      band: Medium
      factors: {reach: 1, stakes: 1, reversibility: 1, blast: 1}
      escalation: "High when the surface is internet-reachable and handles regulated data"
      escalate-if: [surface-internet-reachable, regulated-data-in-scope]
    docs: [analysis/telemetry-by-surface.md]
    why: "The platform's own audit log is the record the organization can hold for a rented surface; the vendor's admin documentation says what it captures and whether it is on by default."
  - key: content-channel-off
    family: record
    question: "Is prompt, tool-call and answer text captured anywhere for this surface? (No selects this key.)"
    method: [I]
    weight: REVIEW
    priority:
      band: Low
      factors: {reach: 0, stakes: 1, reversibility: 0, blast: 1}
    docs: [analysis/telemetry-by-surface.md, analysis/what-to-log-and-what-it-costs.md]
    why: "The content half of the record is off by default on most sanctioned platforms; whether that is right depends on the capture tier and the law, so it is reviewed rather than flagged."
  - key: content-channel-on
    family: record
    question: "Same question as content-channel-off; yes selects this key."
    method: [I]
    weight: REVIEW
    priority:
      band: Low
      factors: {reach: 0, stakes: 2, reversibility: 0, blast: 0}
    docs: [analysis/telemetry-by-surface.md, analysis/what-to-log-and-what-it-costs.md]
    why: "Captured content is a store of whatever users typed, with the retention, access and erasure duties that brings."
  - key: content-lands-vendor
    family: record
    question: "Where does captured content land: with the vendor, in your own cloud, or on laptops? (vendor selects this key.)"
    method: [I]
    requires: [content-channel-on]
    weight: REVIEW
    priority:
      band: Low
      factors: {reach: 1, stakes: 1, reversibility: 0, blast: 0}
    docs: [analysis/telemetry-by-surface.md]
    why: "Content held by the vendor is retained on the vendor's terms and reachable only through its export."
  - key: content-lands-own-cloud
    family: record
    question: "Where does captured content land: with the vendor, in your own cloud, or on laptops? (own-cloud selects this key.)"
    method: [I]
    requires: [content-channel-on]
    weight: REVIEW
    priority:
      band: Low
      factors: {reach: 0, stakes: 1, reversibility: 0, blast: 0}
    docs: [analysis/telemetry-by-surface.md]
    why: "Content in the organization's own cloud is under its own retention and access controls."
  - key: content-lands-laptop
    family: record
    question: "Where does captured content land: with the vendor, in your own cloud, or on laptops? (laptop selects this key.)"
    method: [I]
    requires: [content-channel-on]
    weight: REVIEW
    priority:
      band: Low
      factors: {reach: 0, stakes: 1, reversibility: 1, blast: 0}
    docs: [analysis/telemetry-by-surface.md]
    why: "Content on endpoints is scattered, hard to retain consistently and hard to erase."
  - key: schema-none
    family: record
    question: "What format is the AI audit record emitted in: none, the vendor's own JSON, OpenTelemetry, or OCSF? (none selects this key.)"
    method: [I, E]
    weight: INVENTORY
    docs: [analysis/landing-ai-events-in-ocsf.md]
    why: "OCSF is the schema standard the landing doc maps to; the emitted format decides how much normalization the pipeline owes."
  - key: schema-vendor-json
    family: record
    question: "What format is the AI audit record emitted in: none, the vendor's own JSON, OpenTelemetry, or OCSF? (vendor-json selects this key.)"
    method: [I, E]
    weight: INVENTORY
    docs: [analysis/landing-ai-events-in-ocsf.md]
    why: "OCSF is the schema standard the landing doc maps to; the emitted format decides how much normalization the pipeline owes."
  - key: schema-otel
    family: record
    question: "What format is the AI audit record emitted in: none, the vendor's own JSON, OpenTelemetry, or OCSF? (otel selects this key.)"
    method: [I, E]
    weight: INVENTORY
    docs: [analysis/landing-ai-events-in-ocsf.md]
    why: "OCSF is the schema standard the landing doc maps to; the emitted format decides how much normalization the pipeline owes."
  - key: schema-ocsf
    family: record
    question: "What format is the AI audit record emitted in: none, the vendor's own JSON, OpenTelemetry, or OCSF? (ocsf selects this key.)"
    method: [I, E]
    weight: INVENTORY
    docs: [analysis/landing-ai-events-in-ocsf.md]
    why: "OCSF is the schema standard the landing doc maps to; the emitted format decides how much normalization the pipeline owes."
  - key: prompt-capture-tier-none
    family: record
    question: "Which prompt-capture tier is in place: none, metadata only, hashes, deltas, or full text? (none selects this key.)"
    method: [I]
    weight: REVIEW
    priority:
      band: Low
      factors: {reach: 0, stakes: 0, reversibility: 0, blast: 1}
    docs: [analysis/what-to-log-and-what-it-costs.md, analysis/prompt-capture-and-the-law.md]
    why: "Data-protection law ties what may be captured to purpose and proportionality (GDPR Articles 5 and 35); metadata is cheap and full text is the costly, regulated tier."
  - key: prompt-capture-tier-metadata
    family: record
    question: "Which prompt-capture tier is in place: none, metadata only, hashes, deltas, or full text? (metadata selects this key.)"
    method: [I]
    weight: REVIEW
    priority:
      band: Low
      factors: {reach: 0, stakes: 1, reversibility: 0, blast: 0}
    docs: [analysis/what-to-log-and-what-it-costs.md, analysis/prompt-capture-and-the-law.md]
    why: "Data-protection law ties what may be captured to purpose and proportionality (GDPR Articles 5 and 35); metadata is cheap and full text is the costly, regulated tier."
  - key: prompt-capture-tier-hash
    family: record
