special-keys:
  - key: "audit-always-fetch"
    effect: "Marks the four Always Fetch docs, which every review reads and the Anti-Bloat Rule never drops."
  - key: "questionnaire-only"
    effect: "Recorded in output frontmatter when nothing was read from a system; the review says so."
  - key: "not-checked"
    effect: "An unsupplied signal; reported as not checked, never as clean, and routed to a Question Packet."
  - key: "family-not-run-<family>"
    effect: "A family the practitioner says the organization does not run; suppresses its rows and emits one how-do-you-know question."
  - key: "question-packet"
    effect: "A category-level question for the owning role, produced for every not-checked or believed-only signal."
  - key: "profile-override-<reason>"
    effect: "A stated override of the sizing perspective (own-by-mandate, gateway-chosen, and similar); recorded in output frontmatter and changes which variant of the decision sequence is applied."
  - key: "contributing-new-analysis"
    effect: "Used only by analysis/CANONICAL-DOC-TEMPLATE.md; routes nothing."
