    why: "Capture rules differ by jurisdiction, so the law doc is read for the regions named."
  - key: jurisdiction-us
    family: record
    question: "Where do the people whose prompts would be captured work? (Select every region that applies; us selects this key.)"
    method: [I]
    weight: INVENTORY
    docs: [analysis/prompt-capture-and-the-law.md]
    why: "Capture rules differ by jurisdiction, so the law doc is read for the regions named. A us-only answer triggers the sentence saying the law doc is EU-first and naming what it does not answer."
  - key: jurisdiction-uk
    family: record
    question: "Where do the people whose prompts would be captured work? (Select every region that applies; uk selects this key.)"
    method: [I]
    weight: INVENTORY
    docs: [analysis/prompt-capture-and-the-law.md]
    why: "Capture rules differ by jurisdiction, so the law doc is read for the regions named."
  - key: jurisdiction-other
    family: record
    question: "Where do the people whose prompts would be captured work? (Select every region that applies; other selects this key.)"
    method: [I]
    weight: INVENTORY
    docs: [analysis/prompt-capture-and-the-law.md]
    why: "Capture rules differ by jurisdiction, so the law doc is read for the regions named."
  - key: dpia-absent
    family: record
    owner: "privacy or legal counsel"
    question: "Where prompt content is captured and EU staff are in scope, has a data protection impact assessment been done for that capture? (No selects this key.)"
    method: [I]
    weight: PROBLEM
    priority:
      band: High
      factors: {reach: 0, stakes: 2, reversibility: 2, blast: 2}
    docs: [analysis/prompt-capture-and-the-law.md]
    why: "GDPR Article 35 requires a DPIA for processing likely to result in high risk, which systematic monitoring of employees' text usually is. Not legal advice."
  - key: works-council-unconsulted
    family: record
    owner: "privacy or legal counsel"
    question: "Where capture is on and a works council or employee representative body exists, has it been consulted? (No selects this key.)"
    method: [I]
    weight: PROBLEM
    priority:
      band: High
      factors: {reach: 0, stakes: 2, reversibility: 2, blast: 2}
    docs: [analysis/prompt-capture-and-the-law.md]
    why: "Co-determination law in several EU states (Germany's Works Constitution Act, section 87(1) no. 6, for example) gives the works council a say over technical monitoring of employees. Not legal advice."
  - key: record-in-agent-reach
    family: record
    question: "Can the agent or harness that produced the telemetry also write to or delete from where it is stored? (Yes selects this key.)"
    method: [I]
    weight: REVIEW
    priority:
      band: Medium
      factors: {reach: 0, stakes: 1, reversibility: 2, blast: 1}
    docs: [analysis/tamper-evident-record.md]
    why: "A record the actor can edit is not evidence; OCSF carries integrity fields for exactly this."
  - key: telemetry-into-llm
    family: record
    question: "Does any SOC tool or analyst agent read raw event text with a language model? (Yes selects this key.)"
    method: [I]
    weight: REVIEW
    priority:
      band: Medium
      factors: {reach: 2, stakes: 1, reversibility: 0, blast: 1}
    docs: [analysis/telemetry-is-an-injection-surface.md]
    why: "Event text carries attacker-controlled strings, so a model reading it is exposed to prompt injection, which OWASP's Top 10 for LLM Applications names as a risk class."

  # --- identity ---
  - key: nhi-inventory-absent
    family: identity
    question: "Is there an inventory of agent identities, borrowed workload identities, static secrets and delegated grants? (No selects this key.)"
    method: [I, E]
    weight: PROBLEM
    priority:
      band: Medium
      factors: {reach: 1, stakes: 2, reversibility: 0, blast: 1}
    docs: [analysis/agent-identity-and-delegation.md]
    why: "Identity controls start from an inventory of non-human identities; the agent usually borrows a human or workload identity rather than holding its own."
  - key: agent-static-secrets
    family: identity
    question: "Do agents hold long-lived API keys rather than short-lived credentials minted by a broker? (Yes selects this key; an MCP-config reducer can report an inline-secret count, never values.)"
    method: [I, E]
    weight: PROBLEM
    priority:
      band: High
      factors: {reach: 2, stakes: 2, reversibility: 1, blast: 1}
    docs: [analysis/agent-identity-and-delegation.md]
    why: "Long-lived secrets in agent configuration are the credential-theft path; short-lived, scoped credentials are the standard replacement."
  - key: delegation-record-absent
    family: identity
    question: "Is there a record that joins agent, user, tool and scope for each action? (No selects this key.)"
    method: [I]
    weight: REVIEW
    priority:
      band: Low
      factors: {reach: 0, stakes: 1, reversibility: 0, blast: 1}
    docs: [analysis/agent-identity-and-delegation.md]
    why: "Low priority because no production source carries the full join today; the doc says what can be assembled meanwhile."
  - key: ai-gateway-absent
    family: identity
    question: "Does model and tool traffic pass through an enforcement point the organization owns (a gateway or proxy)? (No selects this key; suppressed when surface-S8 is absent.)"
    method: [I, E]
    weight: REVIEW
    priority:
      band: Medium
      factors: {reach: 1, stakes: 1, reversibility: 0, blast: 2}
    docs: [analysis/ai-apis-and-the-gateway.md]
    why: "An owned enforcement point is where policy, logging and key custody can be applied independent of each client."
  - key: ai-gateway-present
    family: identity
    question: "Same question as ai-gateway-absent; yes selects this key."
    method: [I, E]
    weight: INVENTORY
    docs: [analysis/ai-apis-and-the-gateway.md]
    why: "A gateway present enables the token-store question."
  - key: gateway-token-store-unreviewed
    family: identity
    requires: [ai-gateway-present]
    question: "Where a gateway is present, is its credential cache treated and monitored as a crown-jewel store? (No selects this key.)"
    method: [I]
    weight: REVIEW
    priority:
      band: High
      factors: {reach: 1, stakes: 2, reversibility: 1, blast: 2}
    docs: [analysis/ai-apis-and-the-gateway.md]
    why: "The gateway holds every upstream key, so compromising it compromises every route behind it."
  - key: cloud-trail-default-only
    family: identity
    question: "Is model-API usage visible only through the cloud provider's default audit trail, with no data-event or invocation logging added? (Yes selects this key.)"
    method: [I]
    weight: REVIEW
    priority:
      band: Medium
      factors: {reach: 1, stakes: 1, reversibility: 0, blast: 1}
    docs: [analysis/ai-apis-and-the-gateway.md]
    why: "Default management-plane trails differ by provider in whether model invocations appear at all; the cloud provider's logging documentation is the primary."

