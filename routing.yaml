      factors: {reach: 0, stakes: 1, reversibility: 0, blast: 0}
    docs: [analysis/what-to-log-and-what-it-costs.md, analysis/prompt-capture-and-the-law.md]
    why: "Data-protection law ties what may be captured to purpose and proportionality (GDPR Articles 5 and 35); metadata is cheap and full text is the costly, regulated tier."
  - key: prompt-capture-tier-delta
    family: record
    question: "Which prompt-capture tier is in place: none, metadata only, hashes, deltas, or full text? (delta selects this key.)"
