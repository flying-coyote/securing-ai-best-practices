# Synthetic fixture: a 300-person SaaS company, no sector regulator, about one
# and a half people on security. It rents every AI surface it uses: the
# office-suite assistant, AI features in SaaS it already pays for, browser AI,
# two coding agents and a product team calling a model API directly. Nothing
# here describes a real organization.
#
# What this fixture exercises: the small-org branch (five top actions); a
# derived profile key (profile-rent-heavy computed from three surfaces answered
# no); an escalation whose condition is observed (oauth-grants-unreviewed rises
# to High on the consent-grant count) and one whose condition is not
# (audit-log-off-office-suite-assistant stays Medium); the believed cap
# (agent-static-secrets, High by its factors, capped to Medium); unsure and
# missing answers becoming Question Packets; surfaces answered no batched into
# one how-do-you-know line; and a pattern-key instance.
answers-block: 1
interview-branch: small-org
overrides: []
observations:
  # as the consent-grant and coding-agent settings reducers would print them
  ai-apps-with-grants: {value: 4, confidence: read}
  ai-grants-mail-or-file-scope: {value: 2, confidence: read}
  managed-tier-seen: {value: false, confidence: read}
