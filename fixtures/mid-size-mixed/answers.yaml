# sector regulator, staff in the EU and the US, that rents most of its AI but
# runs one RAG store over its support knowledge base. It uses a managed model
# platform in one cloud, coding agents with MCP servers, and has already chosen
# an AI gateway. Nothing here describes a real organization.
#
