# organization under the size line, because it is own-heavy; both derived
# profile keys (profile-own-heavy, and own-heavy-small-org from it); an answer
# that contradicts its derivation (the practitioner said rent-heavy, but the
# RAG store makes it own-heavy), reported under conflicts; the
# prompt-capture escalation that changes weight as well as band; a row
# reachable only through `requires` (gateway-token-store-unreviewed);
# reducer counts selecting MCP keys; a surface answered unsure; two pattern
# instances, one yes and one no; and a profile override.
